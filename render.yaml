services:
  - type: web
    name: devtrack-combined
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DatabaseProvider
        value: SqlServer
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__SigningKey
        sync: false
      - key: AdminAuth__Username
        sync: false
      - key: AdminAuth__Password
        sync: false
      - key: ApiSettings__BaseUrl
        value: http://localhost:5000
