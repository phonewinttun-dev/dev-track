<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DevTrack · System flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../DevTrack.WebApp/wwwroot/lib/jquery/dist/jquery.min.js" defer></script>
  <style>
    :root { color-scheme: dark; --canvas:#0d1320; --panel:#121c2d; --line:#2b3c52; --muted:#a8b8ce; --ink:#edf4ff; --accent:#75edc4; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(ellipse at 70% -20%,#223c57,transparent 55%),var(--canvas); font:15px/1.55 system-ui,sans-serif; }
    .shell { width:min(100% - 32px,1100px); margin-inline:auto; }
    .bar { min-height:64px; border-bottom:1px solid var(--line); }
    .brand { color:var(--ink); font-weight:750; letter-spacing:-.02em; }
    .brand-mark { display:inline-grid; place-items:center; width:30px; height:30px; border:1px solid #3d796e; border-radius:8px; color:var(--accent); }
    .hero { padding-block:clamp(36px,7vw,76px) 30px; }
    h1 { margin:0; font-size:clamp(2.7rem,7vw,5rem); font-weight:760; letter-spacing:-.075em; line-height:1.04; }
    .hero p { color:var(--muted); margin:14px 0 0; max-width:46ch; }
    .switcher { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
    .switcher button,.controls button { min-height:44px; padding:8px 14px; color:var(--muted); border:1px solid var(--line); border-radius:9px; background:#142031; font-weight:650; }
    .switcher button[aria-pressed="true"] { border-color:#54bfa3; background:#203c3c; color:var(--accent); }
    button { cursor:pointer; font:inherit; }
    button:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    button:disabled { opacity:.45; cursor:default; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(0,1fr); gap:18px; padding-bottom:40px; }
    .surface { min-width:0; border:1px solid var(--line); border-radius:17px; background:var(--panel); }
    .diagram { padding:clamp(14px,3vw,27px); background-image:radial-gradient(#2b3c52 1px,transparent 1px); background-size:18px 18px; }
    .stage { display:grid; grid-template-columns:repeat(var(--columns,1),minmax(0,1fr)); gap:10px; }
    .node { text-align:left; padding:12px; min-height:70px; border:1px solid #3b4e68; border-radius:11px; background:#162438; color:var(--ink); transition:background .15s,border-color .15s; }
    .node:hover,.controls button:not(:disabled):hover { border-color:var(--accent); }
    .node[aria-pressed="true"] { border-color:var(--accent); background:#203b41; }
    .node strong,.node span { display:block; }
    .node span { font-size:.8rem; color:var(--muted); overflow-wrap:anywhere; }
    .node .layer, .details .layer { color:var(--layer-ink); font-size:.7rem; font-weight:750; letter-spacing:.09em; text-transform:uppercase; margin:0 0 5px; }
    [data-layer="Browser"] { --layer-ink:#f3ca82; }
    [data-layer="MVC"] { --layer-ink:#a6caff; }
    [data-layer="API"] { --layer-ink:#b9b0ff; }
    [data-layer="Domain"] { --layer-ink:#75edc4; }
    [data-layer="Database"] { --layer-ink:#f8a9be; }
    .facts { margin:18px 0; display:grid; gap:10px; }
    .facts div { border-top:1px solid var(--line); padding-top:8px; min-width:0; }
    .facts dt { color:var(--muted); font-size:.77rem; font-weight:700; }
    .facts dd { margin:2px 0 0; overflow-wrap:anywhere; }
    .connector { display:flex; align-items:center; justify-content:center; gap:7px; min-height:33px; color:var(--muted); font-size:.77rem; text-align:center; }
    .connector i { color:var(--accent); font-style:normal; }
    .details { padding:clamp(17px,3vw,27px); display:flex; flex-direction:column; }
    .details h2 { margin:0; font-size:1.75rem; line-height:1.2; font-weight:730; letter-spacing:-.04em; overflow-wrap:anywhere; }
    .details p { color:var(--muted); margin:12px 0; }
    .details a,.bar a { color:var(--accent); text-decoration:underline; text-underline-offset:4px; }
    #step-count { color:var(--accent); font-size:.78rem; margin:0 0 10px; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:24px; }
    [hidden] { display:none !important; }
    @media (max-width:740px) { .workspace { grid-template-columns:1fr; gap:12px; } }
    @media (max-width:370px) { .stage { gap:7px; } .node { padding:9px; } }
    @media (prefers-reduced-motion:reduce) { .node { transition:none; } }
  </style>
</head>
<body>
  <header class="bar">
    <div class="shell flex min-h-16 items-center justify-between gap-4">
      <div class="brand flex items-center gap-2"><span aria-hidden="true" class="brand-mark">↗</span> DevTrack</div>
      <a href="graph.html">Graphify explorer</a>
    </div>
  </header>
  <main class="shell">
    <section class="hero">
      <h1>System flow</h1>
      <p>Follow a request from the browser through MVC, the API, and the database. Select any step to see what it does.</p>
    </section>
    <div class="switcher" role="group" aria-label="Choose a system flow">
      <button type="button" data-flow="architecture" aria-pressed="false">Architecture</button>
      <button type="button" data-flow="signin" aria-pressed="false">Sign-in &amp; permissions</button>
      <button type="button" data-flow="attendance" aria-pressed="true">Attendance</button>
    </div>
    <div id="attendance-outcome" class="switcher" role="group" aria-label="Choose an attendance submission outcome" hidden>
      <button type="button" data-outcome="valid" aria-pressed="true">Valid submission</button>
      <button type="button" data-outcome="invalid" aria-pressed="false">Invalid submission</button>
    </div>
    <div id="signin-outcome" class="switcher" role="group" aria-label="Choose a sign-in and permissions scenario" hidden>
      <button type="button" data-session="success" aria-pressed="true">Successful sign-in</button>
      <button type="button" data-session="expired" aria-pressed="false">Expired session</button>
      <button type="button" data-session="revoked" aria-pressed="false">Revoked permission</button>
    </div>
    <noscript><p>JavaScript is required for the explorer. Read the <a href="SYSTEM_FLOW.md">system-flow document</a> for the full flow.</p></noscript>
    <div class="workspace">
      <section id="diagram" class="surface diagram" aria-label="Flow steps"></section>
      <aside class="surface details" aria-labelledby="step-title">
        <div aria-live="polite" aria-atomic="true">
          <p id="step-count"></p>
          <p id="step-layer" class="layer"></p>
          <h2 id="step-title">Attendance</h2>
          <p id="step-description"></p>
          <dl class="facts" id="step-facts" hidden>
            <div><dt id="request-label">Request</dt><dd id="step-request"></dd></div>
            <div><dt id="permission-label">Required permission</dt><dd id="step-permission"></dd></div>
            <div><dt id="result-label">Result</dt><dd id="step-result"></dd></div>
          </dl>
          <a id="step-source" href="SYSTEM_FLOW.md">View source</a>
        </div>
        <div id="controls" class="controls" hidden>
          <button type="button" id="previous">← Previous</button>
          <button type="button" id="next">Next →</button>
        </div>
      </aside>
    </div>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!window.jQuery) {
        document.getElementById("step-description").textContent = "jQuery could not load. The system-flow document is still available.";
        return;
      }
      const $ = window.jQuery;
      const flows = {
        architecture: {
          connectors: ["Pages, forms, and session cookie", "HTTP JSON and bearer token", "Feature services and live permissions", "EF Core reads and writes"],
          stages: [
            [["Browser", "HTML · Tailwind CSS · jQuery", "The browser renders Razor-generated HTML and sends page and form requests to MVC.", "../DevTrack.WebApp/Views/Shared/_Layout.cshtml", "Browser", "HTML, redirects, and the MVC session cookie.", "No permission check runs in the browser. The server decides access.", "GET page requests and POST form data to MVC, with the session cookie when signed in and an antiforgery token for protected forms."]],
            [["DevTrack.WebApp", "MVC controllers and Razor views", "MVC owns the browser session and uses shared DTOs to call the API.", "../DevTrack.WebApp/Auth/PermissionAttribute.cs", "MVC", "The browser request, MVC cookie, and any form data.", "MVC authenticates the cookie and asks GET /api/auth/permissions for current grants. It checks the grants required by the MVC action, such as training.write. Antiforgery validation is a separate form check.", "JSON requests to the API, with the JWT from the MVC authentication ticket for protected calls. MVC renders the result as HTML, a redirect, or an export."]],
            [["DevTrack.Api", "HTTP endpoints and dependency registration", "The API routes authorized requests to the Access or Training Management module.", "../DevTrack.Api/Auth/PermissionAttribute.cs", "API", "The HTTP method, route, parameters or JSON body, and bearer JWT for protected endpoints.", "JWT authentication verifies the token. Protected feature endpoints independently check their required grant through RbacService. The permissions endpoint requires authentication and returns the current grant list.", "The authenticated user ID to Access for grant lookups, or validated route and request data to the feature service. The API serializes the response for MVC."]],
            [["Access module", "Account login and role grants", "RbacService validates credentials and resolves permissions from the user’s current active account and role.", "../DevTrack.Domain.Access/Features/Auth/RbacService.cs", "Domain", "Credentials on sign-in, or a user ID and optional required permission from the API.", "Access resolves current grants from the database. The API and MVC enforce their own required permissions using that information.", "EF Core queries to the database. Returns an authenticated user, a permission list, or a permission decision to the API."],
             ["Training Management", "Dashboard, batches, developers, attendance", "Feature services apply training rules and return typed results.", "../DevTrack.Domain/Features/Training/TrainingService.cs", "Domain", "Request DTOs and route values from an authorized API action.", "The API enforces feature permissions before calling the service. The service separately validates business rules such as class dates and roster membership.", "EF Core queries or writes to the database. Returns a typed Result or PagedResult to the API."]],
            [["Database", "SQL Server or in-memory learning data", "DevTrackDbContext manages persistence. Render uses SQL Server, while learning mode uses an in-memory store.", "../DevTrack.Database/Entities/DevTrackDbContext.cs", "Database", "EF Core queries and changes requested by Access or Training Management.", "No separate feature-permission check runs here. SQL Server enforces schema rules, such as attendance uniqueness.", "Rows, aggregates, or a save result back to the calling domain service."]]
          ]
        }
      };
      const accountController = "../DevTrack.WebApp/Controllers/AccountController.cs";
      const authController = "../DevTrack.Api/Controllers/AuthController.cs";
      const mvcPermissionFilter = "../DevTrack.WebApp/Auth/PermissionAttribute.cs";
      const rbacService = "../DevTrack.Domain.Access/Features/Auth/RbacService.cs";
      const dashboardRead = "dashboard.read";
      const liveGrants = "GET /api/auth/permissions";
      const signedInRequest = ["Open the dashboard", "Browser sends the session cookie", "The cookie links the browser request to the MVC authentication ticket. The examples use the dashboard as the protected page.", "../DevTrack.WebApp/Controllers/HomeController.cs", "Browser", "GET / · MVC cookie", dashboardRead, "MVC begins authorization for the dashboard."];
      const requestGrants = ["Request current grants", "MVC → API", "MVC uses the JWT in its authentication ticket to fetch the user’s current permissions before the dashboard action runs.", mvcPermissionFilter, "MVC", liveGrants + " · bearer JWT", "Authenticated JWT for the lookup. The dashboard requires " + dashboardRead + ".", "The API validates the token before looking up grants."];
      const signinScenarios = {
        success: {
          connectors: ["Credentials", "Account lookup", "Signed JWT", "Next browser request", "Live permission check", "Authorized dashboard request"],
          steps: [
            ["Submit credentials", "Browser → MVC", "The browser submits the username and password with an antiforgery token.", accountController, "Browser", "POST /Account/Login", "Public sign-in. Antiforgery token required.", "MVC receives the sign-in form."],
            ["Forward credentials", "MVC → API", "MVC forwards the credentials using AuthApiClient. Invalid credentials redisplay the sign-in form with an error.", "../DevTrack.WebApp/Auth/AuthApiClient.cs", "MVC", "POST /api/auth/login · JSON", "Public sign-in. Valid credentials required.", "The API delegates account validation to the Access module."],
            ["Validate the account", "Access module → EF Core", "The Access module checks the active account and password hash, then loads the user’s current role grants.", rbacService, "Domain", "LoginAsync() and GetPermissionsAsync()", "Active account and valid credentials.", "The API returns HTTP 200 with the account details, grants, and a signed JWT."],
            ["Issue the browser session", "MVC cookie sign-in", "MVC stores the API token in the authentication ticket and issues the browser session cookie.", accountController, "MVC", "Cookie SignInAsync()", "Successful API login.", "MVC redirects to the requested local page or to the dashboard."],
            signedInRequest,
            ["Read live dashboard access", "API → Access module", "The API reads permissions for the token subject from current role grants. The example user still has dashboard access.", authController, "API", liveGrants + " · bearer JWT", "Authenticated JWT for the lookup. The dashboard requires " + dashboardRead + ".", "HTTP 200 with a permission list containing " + dashboardRead + "."],
            ["Load and render the dashboard", "API rechecks access before serving data", "The dashboard endpoint checks the required permission again. MVC renders the returned data as HTML.", "../DevTrack.Api/Controllers/DashboardController.cs", "API", "GET /api/dashboard · bearer JWT", dashboardRead, "API returns HTTP 200 with dashboard data. MVC renders the dashboard."]
          ]
        },
        expired: {
          connectors: ["Cookie accepted", "Token validation", "HTTP 401"],
          steps: [
            signedInRequest,
            requestGrants,
            ["Reject the expired JWT", "API authentication", "This example starts with an MVC cookie that is still accepted while its API JWT has expired. The API challenge happens before the Access module loads any grants.", "../DevTrack.Api/Auth/ConfigureJwtBearerOptions.cs", "API", liveGrants + " · expired bearer JWT", "Valid, unexpired JWT.", "HTTP 401 Unauthorized. No permission list is returned."],
            ["Clear the session and challenge", "MVC redirects to sign-in", "MVC signs out the stale cookie and challenges the browser. If the MVC cookie itself has expired, MVC challenges immediately without an API permission request.", mvcPermissionFilter, "MVC", "Cookie SignOutAsync() and ChallengeResult", "A valid session is required for " + dashboardRead + ".", "HTTP 302 to /Account/Login with a return URL. No dashboard data is requested."]
          ]
        },
        revoked: {
          connectors: ["Cookie accepted", "Valid JWT", "Current role grants", "Required grant missing"],
          steps: [
            signedInRequest,
            requestGrants,
            ["Accept the JWT", "API authentication", "The JWT still identifies the user. The permissions endpoint uses its subject to look up grants for that account.", authController, "API", liveGrants + " · valid bearer JWT", "Authenticated JWT for the lookup.", "The API delegates the lookup to the Access module."],
            ["Read grants after revocation", "Access module → EF Core", "The current role grants omit dashboard.read. The API returns the current permission list rather than relying on the permission claims from sign-in.", rbacService, "Domain", "GetPermissionsAsync(userId)", "Active account. The dashboard requires " + dashboardRead + ".", "HTTP 200 with current grants that omit " + dashboardRead + "."],
            ["Deny dashboard access", "MVC redirects to Access Denied", "MVC returns Forbid when a required permission is missing. The session stays signed in, so pages with granted permissions remain available.", mvcPermissionFilter, "MVC", "ForbidResult for GET /", dashboardRead, "HTTP 302 to /Account/Denied. No dashboard data is requested."]
          ]
        }
      };
      const write = "training.write";
      const attendanceForm = "../DevTrack.WebApp/Controllers/AttendanceController.cs";
      const trainingApi = "../DevTrack.Api/Controllers/TrainingController.cs";
      const trainingService = "../DevTrack.Domain/Features/Training/TrainingService.cs";
      const markRoute = "POST /Attendance/Mark";
      const bulkRoute = "POST /api/training/attendance/bulk";
      const initialAttendanceSteps = [
        ["Submit attendance marks", markRoute, "Staff submit the batch, class date, and marks as form data, along with the antiforgery token.", attendanceForm, "Browser", markRoute, write, "MVC receives the attendance form."],
        ["Check the form and permissions", "MVC antiforgery and live permission check", "MVC requires a valid antiforgery token and queries the API for the signed-in user’s current permissions.", "../DevTrack.WebApp/Program.cs", "MVC", markRoute + " · GET /api/auth/permissions", write, "MVC sends the bulk request after both checks pass."],
        ["Authorize the bulk update", bulkRoute, "The API validates the bearer token and checks the write permission again before calling TrainingService.", trainingApi, "API", bulkRoute + " · bearer JWT and JSON", write, "Authorized request reaches TrainingService."]
      ];
      const outcomes = {
        valid: [
          ["Accept the submission", "Class date and roster match", "The class requires attendance, and the submission has exactly one supported status for every developer on the roster.", trainingService, "Domain", "MarkBulkAttendanceAsync(BulkAttendanceRequest)", write + " (checked by API)", "Validation passes and the service prepares the update."],
          ["Save marks", "EF Core persistence", "SQL Server enforces one attendance row per batch, date, and developer.", "../init_db.sql", "Database", "EF Core SaveChangesAsync()", "No separate feature check", "Marks are saved. The API returns HTTP 200 with a successful Result."],
          ["Redirect to the summary", "Attendance results", "MVC redirects to the attendance summary. Following that redirect requires read access.", attendanceForm, "MVC", "HTTP 302 → GET /Attendance?batchId={id}", "training.read and batches.read", "The summary includes the saved marks if the user has read access."]
        ],
        invalid: [
          ["Reject a duplicate mark", "Example: the same developer appears twice", "The submitted developer IDs must be unique and match the batch roster. This submission fails validation before EF Core saves anything.", trainingService, "Domain", "MarkBulkAttendanceAsync(BulkAttendanceRequest)", write + " (checked by API)", "Result.Failure. Existing marks are preserved."],
          ["Return the validation failure", "HTTP 200 with a failed Result", "The endpoint uses the shared Result body for this business validation failure.", trainingApi, "API", bulkRoute, write, "HTTP 200 with IsSuccess=false and the validation message."],
          ["Redisplay the marking form", "Validation message on the same page", "MVC adds the message to ModelState and reloads the marking view for the same batch and date.", attendanceForm, "MVC", markRoute, write, "The form shows the error. MVC does not redirect."]
        ]
      };
      let flowName = "attendance";
      let outcome = "valid";
      let sessionScenario = "success";
      let currentStep = 0;
      let steps = [];

      function selectStep(index) {
        currentStep = index;
        const [title, , description, source, layer, request, permission, result] = steps[index];
        const architecture = flowName === "architecture";
        $("#diagram button").attr("aria-pressed", "false").eq(index).attr("aria-pressed", "true");
        $("#step-count").text(`Step ${index + 1} of ${steps.length}`);
        $("#step-title").text(title);
        $("#step-layer").attr("data-layer", layer).text(layer);
        $("#step-description").text(description);
        $("#step-source").attr("href", source);
        $("#step-facts").prop("hidden", request === undefined);
        $("#request-label").text(architecture ? "Receives" : "Request");
        $("#permission-label").text(architecture ? "Permission checks" : "Required permission");
        $("#result-label").text(architecture ? "Passes onward" : "Result");
        $("#step-request").text(request ?? "");
        $("#step-permission").text(permission ?? "");
        $("#step-result").text(result ?? "");
        $("#previous").prop("disabled", index === 0);
        $("#next").prop("disabled", index === steps.length - 1);
      }

      function renderFlow(name, selectedStep = 0) {
        flowName = name;
        const attendance = name === "attendance";
        const signin = name === "signin";
        const session = signinScenarios[sessionScenario];
        const flow = attendance ? {
          stages: [...initialAttendanceSteps, ...outcomes[outcome]].map(step => [step]),
          connectors: ["Form submission", "Bearer JWT + JSON", "Training service", outcome === "valid" ? "Validation passed" : "Validation failed", "Result returned to MVC"]
        } : signin ? { stages: session.steps.map(step => [step]), connectors: session.connectors } : flows.architecture;
        steps = flow.stages.flat();
        const $diagram = $("#diagram").empty();
        let index = 0;
        flow.stages.forEach((stage, row) => {
          if (row > 0) {
            const $connector = $("<div>", { class: "connector" });
            $connector.append($("<i>", { "aria-hidden": "true" }).text("↓"), document.createTextNode(flow.connectors[row - 1]));
            $diagram.append($connector);
          }
          const $stage = $("<div>", { class: "stage" }).css("--columns", stage.length);
          stage.forEach(() => {
            const [title, subtitle, , , layer] = steps[index];
            const $node = $("<button>", { type: "button", class: "node", "data-step": index++ });
            $node.append($("<span>", { class: "layer", "data-layer": layer }).text(layer), $("<strong>").text(title), $("<span>").text(subtitle));
            $stage.append($node);
          });
          $diagram.append($stage);
        });
        $("#controls").prop("hidden", false);
        $("#attendance-outcome").prop("hidden", !attendance);
        $("#signin-outcome").prop("hidden", !signin);
        selectStep(Math.min(selectedStep, steps.length - 1));
      }

      $("[data-flow]").on("click", function () {
        $("[data-flow]").attr("aria-pressed", "false");
        $(this).attr("aria-pressed", "true");
        renderFlow($(this).data("flow"));
      });
      $("[data-outcome]").on("click", function () {
        outcome = this.dataset.outcome;
        $("[data-outcome]").attr("aria-pressed", "false");
        $(this).attr("aria-pressed", "true");
        renderFlow(flowName, currentStep);
      });
      $("[data-session]").on("click", function () {
        sessionScenario = this.dataset.session;
        $("[data-session]").attr("aria-pressed", "false");
        $(this).attr("aria-pressed", "true");
        renderFlow("signin");
      });
      $("#diagram").on("click", "[data-step]", function () {
        selectStep(Number(this.dataset.step));
      });
      $("#previous").on("click", () => selectStep(currentStep - 1));
      $("#next").on("click", () => selectStep(currentStep + 1));
      renderFlow("attendance");
    });
  </script>
</body>
</html>
